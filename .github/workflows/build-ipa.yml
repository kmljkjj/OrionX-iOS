name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'project.yml'
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 15.4
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          xcodebuild -version

      - name: XcodeGen
        run: brew install xcodegen

      - name: Generate + patch objectVersion 56
        run: |
          xcodegen generate
          python3 - <<'PY'
          import pathlib, re
          p = pathlib.Path("OrionX.xcodeproj/project.pbxproj")
          t = p.read_text()
          t = re.sub(r"objectVersion = \d+", "objectVersion = 56", t, count=1)
          t = re.sub(r'compatibilityVersion = "[^"]+"', 'compatibilityVersion = "Xcode 14.0"', t, count=1)
          p.write_text(t)
          print("patched")
          PY

      - name: Archive unsigned
        run: |
          set -euo pipefail
          xcodebuild \
            -project OrionX.xcodeproj \
            -scheme OrionX \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/OrionX.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: IPA
        run: |
          mkdir -p Payload
          cp -R build/OrionX.xcarchive/Products/Applications/OrionX.app Payload/
          zip -r OrionX.ipa Payload
          ls -lh OrionX.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: OrionX-ipa
          path: OrionX.ipa
          if-no-files-found: error
