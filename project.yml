name: OrionX
options:
  bundleIdPrefix: app.orionx
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.0"
  objectVersion: 56
  createIntermediateGroups: true
settings:
  MARKETING_VERSION: "1.0.2"
  CURRENT_PROJECT_VERSION: "3"
  TARGETED_DEVICE_FAMILY: "1,2"
  IPHONEOS_DEPLOYMENT_TARGET: "15.0"
  SWIFT_VERSION: "5.0"
  CODE_SIGNING_ALLOWED: "NO"
  CODE_SIGNING_REQUIRED: "NO"
  CODE_SIGN_IDENTITY: ""
  DEVELOPMENT_TEAM: ""
targets:
  OrionX:
    type: application
    platform: iOS
    sources:
      - path: Sources
        excludes:
          - "**/*.md"
          # Anciens fichiers qui peuvent encore être là — on ne les compile plus
          - "Models/**"
          - "Services/**"
          - "Views/**"
          - "Web/**"
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: app.orionx.browser
      PRODUCT_NAME: OrionX
      INFOPLIST_FILE: Sources/Info.plist
      GENERATE_INFOPLIST_FILE: NO
